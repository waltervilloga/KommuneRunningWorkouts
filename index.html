<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏃 Running Workout Planner</title>

<style>

@media (max-width: 1000px){

    #taskList{
        grid-template-columns:repeat(2,1fr);
    }

}

@media (max-width:700px){

    #taskList{
        grid-template-columns:1fr;
    }
    .bottomBar{
    position:fixed;
    left:10px;
    right:10px;
    bottom:15px;
    width:auto;
    border-radius:18px;
    justify-content:space-between;
    padding:12px;
}

.bottomBar button{
    flex:1;
}
    
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#edf2f7;
    padding:30px;
    padding-bottom:100px;
}

.container{
    max-width:1000px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:25px;
}

header h1{
    color:#2c3e50;
    margin-bottom:8px;
}

header p{
    color:#666;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.card h2{
    font-size:34px;
    margin-top:10px;
    color:#27ae60;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.toolbar input{
    flex:1;
    min-width:250px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
    min-height:90px;
}

.form{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    margin-bottom:25px;
}

.form h2{
    margin-bottom:15px;
}

.grid{
    display:grid;
    gap:15px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:12px 20px;
    min-height:48px;
    font-size:15px;
    font-weight:600;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:all .25s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.20);
}

button:active{
    transform:translateY(0);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
}

.saveBtn{
    background:linear-gradient(135deg,#2ecc71,#27ae60);
}

.saveBtn:hover{
    background:#219150;
}

.secondary{
    background:linear-gradient(135deg,#4facfe,#3498db);
}

.secondary:hover{
    background:#2980b9;
}

.warning{
    background:linear-gradient(135deg,#f6b93b,#e67e22);
}

.warning:hover{
    background:#d35400;
}

.danger{
    background:linear-gradient(135deg,#ff6b6b,#e74c3c);
}

.danger:hover{
    background:#c0392b;
}

.bottomBar button:nth-child(1){
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
}

.bottomBar button:nth-child(2){
    background:linear-gradient(135deg,#6c5ce7,#4834d4);
    color:white;
}

.bottomBar button:nth-child(3){
    background:linear-gradient(135deg,#4facfe,#3498db);
    color:white;
}

.bottomBar button:nth-child(4){
    background:linear-gradient(135deg,#2ecc71,#27ae60);
    color:white;
}

.bottomBar button:nth-child(5){
    background:linear-gradient(135deg,#ff6b6b,#e74c3c);
    color:white;
}

.bottomBar button:nth-child(6){
    background:linear-gradient(135deg,#95a5a6,#7f8c8d);
    color:white;
}
.bottomBar{
    margin-top:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    background:#fff;
    padding:15px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}
.task-inline{
    background:white;
    border-left:8px solid #3498db;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.task{
    background:white;
    border-left:8px solid #3498db;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    height:100%;
    position:relative;
    padding-left:48px;
}

.task.completed{
    border-left-color:#27ae60;
    opacity:.75;
}

.task.overdue{
    border-left-color:#e74c3c;
}

.task h3{
    margin-bottom:10px;
    color:#2c3e50;
}

.meta{
    color:#666;
    margin-bottom:10px;
}

.description{
    margin-bottom:15px;
    line-height:1.5;
    white-space:pre-wrap;
    flex:1;
    font-size: 13px;
}

.actions{
    margin-top:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.actions button{
    flex:1;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
    margin-bottom:10px;
}

.badge.upcoming{
    background:#f39c12;
}

.badge.completed{
    background:#27ae60;
}

.badge.overdue{
    background:#e74c3c;
}

.bottomBar{
    margin-top:25px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

#taskList{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:20px;
}
.task{
    position:relative;
}

.selector{
    position:absolute;
    top:18px;
    left:18px;   /* Change to left:18px if you prefer */
    width:22px;
    height:22px;
    cursor:pointer;
    accent-color:#3498db;
}

.hidden{
    display:none;
}

@media(max-width:700px){

.actions{
    flex-direction:column;
}

button{
    width:100%;
}

.bottomBar{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    background:white;

    padding:15px;

    display:flex;

    justify-content:center;

    gap:10px;

    box-shadow:0 -3px 10px rgba(0,0,0,.15);

}

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>🏃 Running Workout Planner</h1>

<p>Plan • Track • Complete</p>

</header>

<div class="dashboard">

<div class="card">
Total
<h2 id="totalCount">0</h2>
</div>

<div class="card">
Completed
<h2 id="completedCount">0</h2>
</div>

<div class="card">
Remaining
<h2 id="remainingCount">0</h2>
</div>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="🔍 Search workout..."
onkeyup="renderTasks()">

<select id="sortSelect" onchange="renderTasks()">
<option value="asc">Schedule ↑</option>
<option value="desc">Schedule ↓</option>
</select>

</div>

<div class="form">

<h2 id="formTitle">Add Workout</h2>

<div class="grid">

<input
type="text"
id="workoutName"
placeholder="Workout Name">

<input
type="datetime-local"
id="schedule">

<input
type="text"
id="venue"
placeholder="Venue (e.g. City Track, River Park)">

<textarea
id="description"
placeholder="Workout Description"></textarea>

<button
class="saveBtn"
onclick="saveWorkout()">
Save Workout
</button>

</div>

</div>

<div id="taskList"></div>

<div class="bottomBar">

    <button onclick="addNewWorkout()">
        ➕ Add
    </button>

    <button onclick="toggleSelectionMode()">
        ☑ Select
    </button>

    <button id="editBtn"
            class="hidden"
            onclick="editSelected()">
        ✏ Edit
    </button>

    <button id="completeBtn"
            class="hidden"
            onclick="completeSelected()">
        ✓ Complete
    </button>

    <button id="deleteBtn"
            class="hidden"
            onclick="deleteSelected()">
        🗑 Delete
    </button>

    <button id="cancelBtn"
            class="hidden"
            onclick="cancelSelection()">
        ✖ Cancel
    </button>

</div>

<script>
    

let workouts = JSON.parse(localStorage.getItem("runningPlanner")) || [];

let selectionMode = false;
let selectedWorkouts = new Set();

let editIndex = -1;

function saveLocal(){
    localStorage.setItem(
        "runningPlanner",
        JSON.stringify(workouts)
    );
}

function formatDate(date){

    return new Date(date).toLocaleString();

}
function addNewWorkout(){

    cancelSelection();

    editIndex = -1;

    document.getElementById("formTitle").innerText = "Add Workout";

    document.getElementById("workoutName").value = "";
    document.getElementById("schedule").value = "";
    document.getElementById("venue").value = "";
    document.getElementById("description").value = "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function editSelected(){

    if(selectedWorkouts.size===0){

        alert("Please select one workout.");

        return;

    }

    if(selectedWorkouts.size>1){

        alert("Please select only one workout to edit.");

        return;

    }

    const index = [...selectedWorkouts][0];

    cancelSelection();

    editWorkout(index);

}

function completeSelected(){

    if(selectedWorkouts.size===0){
        alert("Please select at least one workout.");
        return;
    }

    selectedWorkouts.forEach(index=>{
        workouts[index].completed = !workouts[index].completed;
    });

    saveLocal();
    cancelSelection();
}


function deleteSelected(){

    if(selectedWorkouts.size===0){

        alert("Please select at least one workout.");

        return;

    }

    if(!confirm(`Delete ${selectedWorkouts.size} workout(s)?`))
        return;

    workouts = workouts.filter((w,index)=>!selectedWorkouts.has(index));

    saveLocal();

    cancelSelection();

}

function updateDashboard(){

    let completed = workouts.filter(
        w=>w.completed
    ).length;

    document.getElementById("totalCount").innerText =
        workouts.length;

    document.getElementById("completedCount").innerText =
        completed;

    document.getElementById("remainingCount").innerText =
        workouts.length-completed;

}
function saveWorkout(){
    alert("Save button works");


    console.log("saveWorkout called");

    const name=document.getElementById("workoutName").value.trim();
    const schedule=document.getElementById("schedule").value;
    const venue=document.getElementById("venue").value.trim();
    const description=document.getElementById("description").value.trim();

    if(name==="" || schedule===""){
        alert("Please enter a workout name and schedule.");
        return;
    }

    const workout={
    name:name,
    schedule:schedule,
    venue:venue,
    description:description,
    completed: editIndex>=0 ? workouts[editIndex].completed : false
};

    if(editIndex>=0){
        workouts[editIndex]=workout;
        editIndex=-1;
        document.getElementById("formTitle").innerText="Add Workout";
    }else{
        workouts.push(workout);
    }

    document.getElementById("workoutName").value="";
    document.getElementById("schedule").value="";
    document.getElementById("venue").value="";
    document.getElementById("description").value="";

    saveLocal();
    renderTasks();

}

function renderTasks(){

    const list=document.getElementById("taskList");
    list.innerHTML="";

    let keyword=document.getElementById("search").value.toLowerCase();

    let filtered=[...workouts].filter(w=>

        w.name.toLowerCase().includes(keyword) ||
        w.description.toLowerCase().includes(keyword)

    );

    const order=document.getElementById("sortSelect").value;

    filtered.sort(function(a,b){

        if(order==="asc"){
            return new Date(a.schedule)-new Date(b.schedule);
        }

        return new Date(b.schedule)-new Date(a.schedule);

    });

    filtered.forEach(function(workout){

        const realIndex=workouts.indexOf(workout);

        let status="upcoming";
        let badge="🟡 Upcoming";

        if(workout.completed){

            status="completed";
            badge="🟢 Completed";

        }
        else if(new Date(workout.schedule)<new Date()){

            status="overdue";
            badge="🔴 Overdue";

        }

        const div=document.createElement("div");
        div.className="task "+status;

        div.innerHTML=`

            <span class="badge ${status}">
                ${badge}
            </span>
            ${selectionMode ? `
<input
    type="checkbox"
    class="selector"
    ${selectedWorkouts.has(realIndex) ? "checked" : ""}
    onchange="toggleSelection(${realIndex}, this.checked)">
` : ""}

            <h3>${workout.name}</h3>

            <div class="meta">
                📅 ${formatDate(workout.schedule)}
            </div>

            <div class="meta">
                📍 ${workout.venue || "No venue"}
            </div>

            <div class="description">${workout.description || "No description"}</div>


        `;

        list.appendChild(div);

    });

    updateDashboard();

}

function editWorkout(index){

    const workout=workouts[index];

    document.getElementById("workoutName").value=
        workout.name;

    document.getElementById("schedule").value=
        workout.schedule;
    
    document.getElementById("venue").value =
    workout.venue || "";

    document.getElementById("description").value=
        workout.description;

    editIndex=index;

    document.getElementById("formTitle").innerText=
        "Edit Workout";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function deleteWorkout(index){

    if(!confirm("Delete this workout?"))
        return;

    workouts.splice(index,1);

    saveLocal();

    renderTasks();

}

function toggleComplete(index){

    workouts[index].completed=
        !workouts[index].completed;

    saveLocal();

    renderTasks();

}
function exportJSON(){

    if(workouts.length===0){
        alert("There are no workouts to export.");
        return;
    }

    const data=JSON.stringify(workouts,null,2);

    const blob=new Blob(
        [data],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="running-workouts.json";
    a.click();

    URL.revokeObjectURL(url);

}

function importJSON(event){

    const file=event.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

        try{

            const imported=JSON.parse(e.target.result);

            if(!Array.isArray(imported)){
                throw "Invalid file";
            }

            workouts=imported;

            saveLocal();

            renderTasks();

            alert("Workouts imported successfully!");

        }catch(error){

            alert("Invalid JSON file.");

        }

    };

    reader.readAsText(file);

    event.target.value="";

}

function toggleSelection(index, checked){

    if(checked)
        selectedWorkouts.add(index);
    else
        selectedWorkouts.delete(index);

    updateToolbar();

}

function cancelSelection(){

    selectionMode=false;

    selectedWorkouts.clear();

    updateToolbar();

    renderTasks();

}
function toggleSelectionMode(){

    selectionMode = !selectionMode;

    if(!selectionMode){
        selectedWorkouts.clear();
    }

    updateToolbar();
    renderTasks();

}

function updateToolbar(){

    document.getElementById("editBtn").classList.toggle("hidden", !selectionMode);
    document.getElementById("completeBtn").classList.toggle("hidden", !selectionMode);
    document.getElementById("deleteBtn").classList.toggle("hidden", !selectionMode);
    document.getElementById("cancelBtn").classList.toggle("hidden", !selectionMode);

    document.getElementById("editBtn").disabled =
        selectedWorkouts.size !== 1;

    document.getElementById("completeBtn").disabled =
        selectedWorkouts.size === 0;

    document.getElementById("deleteBtn").disabled =
        selectedWorkouts.size === 0;

    document.getElementById("cancelBtn").disabled =
        !selectionMode;

        const completeBtn = document.getElementById("completeBtn");

    if(selectedWorkouts.size === 0){
        completeBtn.innerText = "✓ Complete";
    }else{
        const selected = [...selectedWorkouts];
        const allCompleted = selected.every(i => workouts[i].completed);

        completeBtn.innerText = allCompleted
            ? "↩ Undo Complete"
            : "✓ Complete";
    }
}

function clearAll(){

    if(!confirm("Delete ALL workouts?")){
        return;
    }

    workouts=[];

    editIndex=-1;

    saveLocal();

    renderTasks();

}
updateToolbar();
renderTasks();

</script>

</body>
</html>
