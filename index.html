<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏃 Running Workout Planner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#edf2f7;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:25px;
}

header h1{
    color:#2c3e50;
    margin-bottom:8px;
}

header p{
    color:#666;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.card h2{
    font-size:34px;
    margin-top:10px;
    color:#27ae60;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.toolbar input{
    flex:1;
    min-width:250px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
    min-height:90px;
}

.form{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
    margin-bottom:25px;
}

.form h2{
    margin-bottom:15px;
}

.grid{
    display:grid;
    gap:15px;
}

button{
    border:none;
    cursor:pointer;
    padding:5px 5px;
    border-radius:8px;
    color:white;
    font-size:15px;
}

.saveBtn{
    background:#27ae60;
}

.saveBtn:hover{
    background:#219150;
}

.secondary{
    background:#3498db;
}

.secondary:hover{
    background:#2980b9;
}

.warning{
    background:#e67e22;
}

.warning:hover{
    background:#d35400;
}

.danger{
    background:#e74c3c;
}

.danger:hover{
    background:#c0392b;
}

.task-inline{
    background:white;
    border-left:8px solid #3498db;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.task{
    background:white;
    border-left:8px solid #3498db;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);

    display:flex;
    flex-direction:column;
    height:100%;
}

.task.completed{
    border-left-color:#27ae60;
    opacity:.75;
}

.task.overdue{
    border-left-color:#e74c3c;
}

.task h3{
    margin-bottom:10px;
    color:#2c3e50;
}

.meta{
    color:#666;
    margin-bottom:10px;
}

.description{
    margin-bottom:15px;
    line-height:1.5;
    white-space:pre-wrap;
    flex:1;
    font-size: 13px;
}

.actions{
    margin-top:auto;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.actions button{
    flex:1;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
    margin-bottom:10px;
}

.badge.upcoming{
    background:#f39c12;
}

.badge.completed{
    background:#27ae60;
}

.badge.overdue{
    background:#e74c3c;
}

.bottomBar{
    margin-top:25px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

#taskList{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:20px;
}

.hidden{
    display:none;
}

@media(max-width:700px){

.actions{
    flex-direction:column;
}

button{
    width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>🏃 Running Workout Planner</h1>

<p>Plan • Track • Complete</p>

</header>

<div class="dashboard">

<div class="card">
Total
<h2 id="totalCount">0</h2>
</div>

<div class="card">
Completed
<h2 id="completedCount">0</h2>
</div>

<div class="card">
Remaining
<h2 id="remainingCount">0</h2>
</div>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="🔍 Search workout..."
onkeyup="renderTasks()">

<select id="sortSelect" onchange="renderTasks()">
<option value="asc">Schedule ↑</option>
<option value="desc">Schedule ↓</option>
</select>

</div>

<div class="form">

<h2 id="formTitle">Add Workout</h2>

<div class="grid">

<input
type="text"
id="workoutName"
placeholder="Workout Name">

<input
type="datetime-local"
id="schedule">

<input
type="text"
id="venue"
placeholder="Venue (e.g. City Track, River Park)">

<textarea
id="description"
placeholder="Workout Description"></textarea>

<button
class="saveBtn"
onclick="saveWorkout()">
Save Workout
</button>

</div>

</div>

<div id="taskList"></div>

<div class="bottomBar">

<button
class="danger"
onclick="clearAll()">
Clear All
</button>


</div>

<script>

let workouts = JSON.parse(localStorage.getItem("runningPlanner")) || [];

let editIndex = -1;

function saveLocal(){
    localStorage.setItem(
        "runningPlanner",
        JSON.stringify(workouts)
    );
}

function formatDate(date){

    return new Date(date).toLocaleString();

}

function updateDashboard(){

    let completed = workouts.filter(
        w=>w.completed
    ).length;

    document.getElementById("totalCount").innerText =
        workouts.length;

    document.getElementById("completedCount").innerText =
        completed;

    document.getElementById("remainingCount").innerText =
        workouts.length-completed;

}
function saveWorkout(){

    const name=document.getElementById("workoutName").value.trim();
    const schedule=document.getElementById("schedule").value;
    const venue=document.getElementById("venue").value.trim();
    const description=document.getElementById("description").value.trim();

    if(name==="" || schedule===""){
        alert("Please enter a workout name and schedule.");
        return;
    }

    const workout={
    name:name,
    schedule:schedule,
    venue:venue,
    description:description,
    completed: editIndex>=0 ? workouts[editIndex].completed : false
};

    if(editIndex>=0){
        workouts[editIndex]=workout;
        editIndex=-1;
        document.getElementById("formTitle").innerText="Add Workout";
    }else{
        workouts.push(workout);
    }

    document.getElementById("workoutName").value="";
    document.getElementById("schedule").value="";
    document.getElementById("venue").value="";
    document.getElementById("description").value="";

    saveLocal();
    renderTasks();

}

function renderTasks(){

    const list=document.getElementById("taskList");
    list.innerHTML="";

    let keyword=document.getElementById("search").value.toLowerCase();

    let filtered=[...workouts].filter(w=>

        w.name.toLowerCase().includes(keyword) ||
        w.description.toLowerCase().includes(keyword)

    );

    const order=document.getElementById("sortSelect").value;

    filtered.sort(function(a,b){

        if(order==="asc"){
            return new Date(a.schedule)-new Date(b.schedule);
        }

        return new Date(b.schedule)-new Date(a.schedule);

    });

    filtered.forEach(function(workout){

        const realIndex=workouts.indexOf(workout);

        let status="upcoming";
        let badge="🟡 Upcoming";

        if(workout.completed){

            status="completed";
            badge="🟢 Completed";

        }
        else if(new Date(workout.schedule)<new Date()){

            status="overdue";
            badge="🔴 Overdue";

        }

        const div=document.createElement("div");
        div.className="task "+status;

        div.innerHTML=`

            <span class="badge ${status}">
                ${badge}
            </span>

            <h3>${workout.name}</h3>

            <div class="meta">
                📅 ${formatDate(workout.schedule)}
            </div>

            <div class="meta">
                📍 ${workout.venue || "No venue"}
            </div>

            <div class="description">${workout.description || "No description"}</div>

            <div class="actions">

                <button
                    class="secondary"
                    onclick="toggleComplete(${realIndex})">

                    ${workout.completed ? "Undo" : "Complete"}

                </button>

                <button
                    class="warning"
                    onclick="editWorkout(${realIndex})">

                    Edit

                </button>

                <button
                    class="danger"
                    onclick="deleteWorkout(${realIndex})">

                    Delete

                </button>

            </div>

        `;

        list.appendChild(div);

    });

    updateDashboard();

}

function editWorkout(index){

    const workout=workouts[index];

    document.getElementById("workoutName").value=
        workout.name;

    document.getElementById("schedule").value=
        workout.schedule;
    
    document.getElementById("venue").value =
    workout.venue || "";

    document.getElementById("description").value=
        workout.description;

    editIndex=index;

    document.getElementById("formTitle").innerText=
        "Edit Workout";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function deleteWorkout(index){

    if(!confirm("Delete this workout?"))
        return;

    workouts.splice(index,1);

    saveLocal();

    renderTasks();

}

function toggleComplete(index){

    workouts[index].completed=
        !workouts[index].completed;

    saveLocal();

    renderTasks();

}
function exportJSON(){

    if(workouts.length===0){
        alert("There are no workouts to export.");
        return;
    }

    const data=JSON.stringify(workouts,null,2);

    const blob=new Blob(
        [data],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="running-workouts.json";
    a.click();

    URL.revokeObjectURL(url);

}

function importJSON(event){

    const file=event.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

        try{

            const imported=JSON.parse(e.target.result);

            if(!Array.isArray(imported)){
                throw "Invalid file";
            }

            workouts=imported;

            saveLocal();

            renderTasks();

            alert("Workouts imported successfully!");

        }catch(error){

            alert("Invalid JSON file.");

        }

    };

    reader.readAsText(file);

    event.target.value="";

}

function clearAll(){

    if(!confirm("Delete ALL workouts?")){
        return;
    }

    workouts=[];

    editIndex=-1;

    saveLocal();

    renderTasks();

}

renderTasks();

</script>

</body>
</html>
